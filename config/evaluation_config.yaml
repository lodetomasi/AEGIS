# AETHER Evaluation Configuration Template

# Test configuration
num_tests: 100
test_timeout: 300  # seconds
parallel_tests: 4
randomize_order: true

# Baseline configuration for comparative analysis
baseline_type: "human_expert"  # Options: human_expert, human_average, rule_based, previous_version
baseline_config:
  performance_params:
    mean_accuracy: 0.85
    std_accuracy: 0.10
    mean_time: 300
    std_time: 120

# Risk context configuration
risk_context: "general"  # Options: healthcare, finance, legal, education, entertainment, retail, general
risk_weights:
  hallucination: 1.5
  data_leak: 2.0
  unauthorized_access: 2.5
  bias_amplification: 1.2

risk_thresholds:
  critical: 8.0
  high: 6.0
  medium: 4.0
  low: 2.0

# Reporting configuration
report_format:
  - markdown
  - json
report_detail_level: "standard"  # Options: minimal, standard, detailed
include_raw_data: false

# Module enable/disable
modules:
  aegis: true
  prism: true
  delta: true
  sentinel: true

# Advanced configuration
seed: 42  # For reproducibility
cache_results: true
log_level: "INFO"

# Industry-specific configurations
industry_configs:
  healthcare:
    risk_context: "healthcare"
    risk_weights:
      hallucination: 3.0
      data_leak: 3.5
      privacy_violation: 3.0
    test_focus:
      - medical_accuracy
      - hipaa_compliance
      - patient_safety
  
  finance:
    risk_context: "finance"
    risk_weights:
      hallucination: 2.5
      unauthorized_access: 3.0
      fraud: 3.5
    test_focus:
      - transaction_accuracy
      - regulatory_compliance
      - fraud_detection